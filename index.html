const GN={1:"أول متوسط",2:"ثاني متوسط"};

/* ====== حفظ حالة الحل (مرة واحدة لكل اختبار) ====== */
function doneKey(wi,g){return "qimmat_done_"+WEEKS[wi].name+"_"+g;}
function getDone(wi,g){
try{const v=localStorage.getItem(doneKey(wi,g));return v?JSON.parse(v):null;}catch(e){return null;}
}
function setDone(wi,g,info){
try{localStorage.setItem(doneKey(wi,g),JSON.stringify(info));}catch(e){}
}
function shuffle(arr){
for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
return arr;
}

function btn(wi,g,icon){
const d=getDone(wi,g);
if(d){return `<button class="choice done" onclick="startQuiz(${wi},${g})">✅ ${GN[g]} - تم الحل (${d.score}/${d.total})</button>`;}
return `<button class="choice" onclick="startQuiz(${wi},${g})">${icon} ${GN[g]}</button>`;
}
function buildHome(){
let h="";
for(let i=WEEKS.length-1;i>=0;i--){
h+=`<div class="week"><h3>📅 ${WEEKS[i].name}</h3>${btn(i,1,"🌸")}${btn(i,2,"🌷")}</div>`;
}
document.getElementById("weeks").innerHTML=h;
}
function startQuiz(wi,grade){
const prev=getDone(wi,grade);
if(prev){
alert("سبق أن حللتِ هذا الاختبار"+(prev.name?" باسم "+prev.name:"")+" ونتيجتك "+prev.score+" من "+prev.total+".\nلا يمكن إعادة الاختبار.");
return;
}
sent=false;
const w=WEEKS[wi], d=w["g"+grade];
let qs=d.q;
if(w.shuffle){
qs=d.q.map(item=>{
const order=shuffle(item.a.map((_,i)=>i));
return {tag:item.tag,q:item.q,a:order.map(i=>item.a[i]),correct:order.indexOf(item.correct)};
});
}
cur={wi:wi,grade:grade,week:w.name,gradeName:GN[grade],q:qs,submitted:false};
document.getElementById("quizTitle").innerHTML=(grade===1?"🌸 ":"🌷 ")+"اختبار لغتي - "+GN[grade]+"<br><small>"+w.name+(d.u?" - "+d.u:"")+"</small>";
const nameInput=document.getElementById("studentName");
nameInput.value="";nameInput.disabled=false;
document.getElementById("submitBtn").disabled=false;
document.getElementById("passageBox").innerHTML="📖 "+d.p;
document.getElementById("result").innerHTML="";
let html="";
qs.forEach((item,index)=>{
html+=`<div class="question"><span class="tag">${item.tag}</span><h3>${index+1}. ${item.q}</h3>`;
item.a.forEach((answer,i)=>{
html+=`<label><input type="radio" name="q${index}" value="${i}"> ${answer}</label>`;
});
html+=`</div>`;
});
document.getElementById("quizForm").innerHTML=html;
document.getElementById("home").style.display="none";
document.getElementById("quizPage").style.display="block";
window.scrollTo(0,0);
}
function checkAnswers(){
if(!cur || cur.submitted){return;}
let name=document.getElementById("studentName").value.trim();
if(name===""){alert("الرجاء كتابة اسمك أولًا");return;}
let score=0, unanswered=0;
cur.q.forEach((item,index)=>{
let s=document.querySelector('input[name="q'+index+'"]:checked');
if(!s){unanswered++;}
else if(Number(s.value)===item.correct){score++;}
});
let msg="بعد إظهار النتيجة لا يمكنك إعادة هذا الاختبار.";
if(unanswered>0){msg="لم تجيبي عن "+unanswered+" سؤال.\n"+msg;}
if(!confirm(msg+"\nهل تريدين المتابعة؟")){return;}
cur.submitted=true;
setDone(cur.wi,cur.grade,{name:name,score:score,total:cur.q.length});
document.getElementById("submitBtn").disabled=true;
document.getElementById("studentName").disabled=true;
document.querySelectorAll('#quizForm input').forEach(el=>{el.disabled=true;});
if(SHEET_URL && !sent){
sent=true;
fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
body:JSON.stringify({name:name,week:cur.week,grade:cur.gradeName,score:score,total:cur.q.length})}).catch(()=>{});
}
document.getElementById("result").innerHTML="🌟 "+name+"، نتيجتك: "+score+" من "+cur.q.length;
}
function goHome(){
document.getElementById("quizPage").style.display="none";
document.getElementById("home").style.display="block";
buildHome();
window.scrollTo(0,0);
}
buildHome();
</script>
</body>
</html>
