<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قمم لغتي</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f3f7f5;
    margin:0;
    padding:20px;
    color:#222;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#246b45;
    font-size:32px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.choice{
    display:block;
    width:100%;
    padding:18px;
    margin:15px 0;
    border:0;
    border-radius:14px;
    background:#246b45;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.choice:hover{
    opacity:.9;
}

.question{
    margin:25px 0;
    padding:18px;
    background:#f7faf8;
    border-radius:14px;
}

.question h3{
    margin-top:0;
}

label{
    display:block;
    padding:12px;
    margin:8px 0;
    background:white;
    border-radius:9px;
    cursor:pointer;
}

label:hover{
    background:#eaf4ee;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#246b45;
    color:white;
    font-size:19px;
    cursor:pointer;
    margin-top:10px;
}

.back{
    background:#777;
}

#result{
    margin-top:20px;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    border-radius:12px;
}
</style>
</head>

<body>

<div class="container">

<div id="home">

<h1>📚 قمم لغتي</h1>

<p class="subtitle">
موقع تفاعلي لمادة لغتي الخالدة
</p>

<h2 style="text-align:center;">
اختاري الصف الدراسي
</h2>

<button class="choice" onclick="startQuiz(1)">
🌸 أول متوسط
</button>

<button class="choice" onclick="startQuiz(2)">
🌷 ثاني متوسط
</button>

</div>


<div id="quizPage" style="display:none;">

<h1 id="quizTitle"></h1>

<form id="quizForm"></form>

<button onclick="checkAnswers()" type="button">
إظهار النتيجة ✅
</button>

<button onclick="goHome()" type="button" class="back">
العودة لاختيار الصف
</button>

<div id="result"></div>

</div>

</div>


<script>

let currentGrade = 1;


/* أسئلة أول متوسط */

const firstGrade = [

{
q:"ما نوع كلمة «الطالب»؟",
a:["اسم","فعل","حرف"],
correct:0
},

{
q:"ما ضد كلمة «الصدق»؟",
a:["الأمانة","الكذب","الوفاء"],
correct:1
},

{
q:"أي الكلمات الآتية اسم؟",
a:["يكتب","كتاب","اكتب"],
correct:1
},

{
q:"الجملة «العلم نور» جملة:",
a:["فعلية","اسمية","استفهامية"],
correct:1
},

{
q:"ما جمع كلمة «كتاب»؟",
a:["كاتب","كتب","مكتبة"],
correct:1
},

{
q:"الفعل «ذهب» فعل:",
a:["ماضٍ","مضارع","أمر"],
correct:0
},

{
q:"أي الجمل الآتية جملة فعلية؟",
a:["السماء صافية","قرأ الطالب الدرس","العلم مفيد"],
correct:1
},

{
q:"ما المفعول به في جملة «قرأ محمدٌ القصةَ»؟",
a:["محمد","قرأ","القصة"],
correct:2
},

{
q:"علامة الترقيم المناسبة في نهاية السؤال:",
a:[".","!","؟"],
correct:2
},

{
q:"أي الكلمات الآتية تحتوي على همزة قطع؟",
a:["استغفار","أحمد","استخدام"],
correct:1
}

];


/* أسئلة ثاني متوسط */

const secondGrade = [

{
q:"ما نوع كلمة «الطالب»؟",
a:["فعل","اسم","حرف"],
correct:1
},

{
q:"ما ضد كلمة «الصدق»؟",
a:["الأمانة","الكذب","الوفاء"],
correct:1
},

{
q:"أي الكلمات الآتية همزتها همزة وصل؟",
a:["أحمد","إكرام","استغفار"],
correct:2
},

{
q:"الجملة «العلم نور» جملة:",
a:["فعلية","اسمية","استفهامية"],
correct:1
},

{
q:"ما جمع كلمة «كتاب»؟",
a:["كاتب","مكتبة","كتب"],
correct:2
},

{
q:"«يقرأ الطالب الكتاب» الفعل «يقرأ» فعل:",
a:["ماضٍ","مضارع","أمر"],
correct:1
},

{
q:"ما المفعول به في «قرأ خالدٌ القصةَ»؟",
a:["خالد","قرأ","القصة"],
correct:2
},

{
q:"كلمة «معلمات» تعد:",
a:["جمع مذكر سالم","جمع مؤنث سالم","جمع تكسير"],
correct:1
},

{
q:"أي الجمل الآتية تحتوي على أسلوب استفهام؟",
a:["ما أجمل العلم!","هل قرأت الدرس؟","احرص على القراءة."],
correct:1
},

{
q:"علامة الترقيم المناسبة في نهاية السؤال:",
a:[".","!","؟"],
correct:2
}

];


function startQuiz(grade){

    currentGrade = grade;

    let questions;

    if(grade === 1){
        questions = firstGrade;
        document.getElementById("quizTitle").innerHTML =
        "🌸 اختبار لغتي - أول متوسط";
    }
    else{
        questions = secondGrade;
        document.getElementById("quizTitle").innerHTML =
        "🌷 اختبار لغتي - ثاني متوسط";
    }

    let form = document.getElementById("quizForm");

    form.innerHTML = "";

    questions.forEach((item,index)=>{

        let html = `
        <div class="question">

        <h3>${index+1}. ${item.q}</h3>
        `;

        item.a.forEach((answer,i)=>{

            html += `
            <label>
            <input type="radio"
            name="q${index}"
            value="${i}">
            ${answer}
            </label>
            `;

        });

        html += `</div>`;

        form.innerHTML += html;

    });

    document.getElementById("home").style.display="none";
    document.getElementById("quizPage").style.display="block";

    window.scrollTo(0,0);
}


function checkAnswers(){

    let questions =
    currentGrade === 1 ? firstGrade : secondGrade;

    let score = 0;

    questions.forEach((item,index)=>{

        let selected =
        document.querySelector(
        'input[name="q'+index+'"]:checked'
        );

        if(selected &&
        Number(selected.value) === item.correct){

            score++;
        }

    });

    document.getElementById("result").innerHTML =
    "🌟 نتيجتك: " + score + " من " + questions.length;

}


function goHome(){

    document.getElementById("quizPage").style.display="none";
    document.getElementById("home").style.display="block";

    document.getElementById("result").innerHTML="";

    window.scrollTo(0,0);
}

</script>

</body>
</html>
